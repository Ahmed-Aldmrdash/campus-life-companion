<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<title>Find a ride · Mobile</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1E4FA3}a:hover{color:#163C7D}
</style>
</helmet>
<div dir="ltr" style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #F6F8FB; font-family: 'Inter', system-ui, sans-serif; color: #0F172A; overflow: hidden">
  <header style="background: #FFFFFF; padding: 14px 16px 12px; display: flex; flex-direction: column; gap: 12px; flex: none; border-bottom: 1px solid #E2E8F0">
    <h1 style="margin: 0; font-size: 22px">Rides</h1>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; background: #F1F5F9; border-radius: 12px; padding: 4px">
      <a href="FindM.dc.html" style="text-decoration: none; color: #0F172A; background: #FFFFFF; border-radius: 10px; height: 40px; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 15px">Find a ride</a>
      <a href="OfferM.dc.html" style="text-decoration: none; color: #475569; border-radius: 10px; height: 40px; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 15px">Offer a ride</a>
    </div>
    <div style="display: flex; gap: 8px; overflow: hidden">
      <span style="flex: none; background: #0F172A; color: #FFFFFF; border-radius: 999px; padding: 6px 12px; font-size: 13px">Nearest</span>
      <span style="flex: none; border: 1px solid #CBD5E1; border-radius: 999px; padding: 6px 12px; font-size: 13px">Tomorrow 7 to 8:30</span>
      <span style="flex: none; border: 1px solid #CBD5E1; border-radius: 999px; padding: 6px 12px; font-size: 13px">Nasr City</span>
    </div>
  </header>

  <main style="flex: 1; overflow: hidden; padding: 14px 16px; display: flex; flex-direction: column; gap: 12px">
    <sc-for list="{{rides}}" as="r" hint-placeholder-count="4">
      <article style="background: #FFFFFF; border: 1px solid #E2E8F0; border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 10px">
        <div style="display: flex; gap: 12px; align-items: center">
          <span style="width: 44px; height: 44px; border-radius: 999px; background: {{r.tint}}; font-weight: 700; display: flex; align-items: center; justify-content: center; flex: none">{{r.initial}}</span>
          <span style="flex: 1; display: flex; flex-direction: column"><span style="font-weight: 600">{{r.name}} <span style="font-weight: 400; font-size: 13px; color: #475569">★ {{r.rating}}</span></span><span style="font-size: 13px; color: #475569">From {{r.from}} · {{r.dist}}</span></span>
          <span style="display: flex; flex-direction: column; align-items: flex-end"><span style="font-weight: 700">{{r.time}}</span><span style="font-weight: 700; color: #15803D; font-size: 15px">{{r.price}} EGP</span></span>
        </div>
        <div style="display: flex; justify-content: space-between; align-items: center">
          <span style="font-size: 13px; color: #475569">{{r.seats}}</span>
          <a href="ChatM.dc.html" style="text-decoration: none; background: #1E4FA3; color: #FFFFFF; font-weight: 600; border-radius: 10px; padding: 0 16px; height: 44px; display: flex; align-items: center; font-size: 14px">Request to join</a>
        </div>
      </article>
    </sc-for>
  </main>

  <nav aria-label="Navigation" style="height: 72px; flex: none; background: #FFFFFF; border-top: 1px solid #E2E8F0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr))">
    <a href="HomeM.dc.html" style="text-decoration: none; color: #64748B; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10l9-7 9 7v10a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Home</a>
    <a href="FindM.dc.html" style="text-decoration: none; color: #1E4FA3; font-weight: 600; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 13l2-6h14l2 6v5h-2M3 13v5h2M3 13h18"/><circle cx="7.5" cy="18" r="1.8"/><circle cx="16.5" cy="18" r="1.8"/></svg>Rides</a>
    <a href="BotM.dc.html" style="text-decoration: none; color: #64748B; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>Assistant</a>
    <a href="ProfileM.dc.html" style="text-decoration: none; color: #64748B; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>Profile</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      rides: [
        { initial: 'Y', tint: '#DBEAFE', name: 'Youssef Khaled', rating: '4.8', from: 'Abbas El-Akkad', dist: '600 m', time: '7:15 am', price: '35', seats: '2 seats left · Silver Verna' },
        { initial: 'S', tint: '#FCE7F3', name: 'Salma Adel', rating: '4.9', from: '7th District', dist: '1.2 km', time: '7:30 am', price: '30', seats: '3 seats · White Cerato' },
        { initial: 'A', tint: '#DCFCE7', name: 'Amr Hassan', rating: '4.6', from: 'Makram Ebeid', dist: '1.8 km', time: '8:00 am', price: '40', seats: '1 seat · Grey Sunny' },
        { initial: 'N', tint: '#FEF3C7', name: 'Nour El-Din', rating: '4.7', from: 'El-Tayaran', dist: '2.4 km', time: '8:20 am', price: '28', seats: '3 seats · Black Corolla' }
      ]
    };
  }
}
</script>
</body>
</html>
