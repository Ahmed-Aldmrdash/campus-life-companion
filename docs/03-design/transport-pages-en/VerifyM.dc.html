<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<title>Sign up and verification code · Mobile</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1E4FA3}a:hover{color:#163C7D}
</style>
</helmet>
<div dir="ltr" style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #FFFFFF; font-family: 'Inter', system-ui, sans-serif; color: #0F172A; overflow: hidden">
  <header style="height: 64px; padding: 0 12px; display: flex; align-items: center; gap: 8px; flex: none">
    <a href="LandingM.dc.html" aria-label="Back" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #0F172A"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></a>
    <div style="flex: 1; display: flex; gap: 6px; padding-inline-end: 12px">
      <span style="flex: 1; height: 4px; border-radius: 4px; background: #1E4FA3"></span>
      <span style="flex: 1; height: 4px; border-radius: 4px; background: {{bar2}}"></span>
      <span style="flex: 1; height: 4px; border-radius: 4px; background: #E2E8F0"></span>
    </div>
  </header>

  <sc-if value="{{isStep1}}" hint-placeholder-val="{{ false }}">
    <form style="flex: 1; padding: 16px 20px 28px; display: flex; flex-direction: column; gap: 16px">
      <h1 style="margin: 0; font-size: 26px">Sign up</h1>
      <div style="display: flex; flex-direction: column; gap: 8px">
        <label for="nm" style="font-size: 15px; font-weight: 600">Name</label>
        <input id="nm" type="text" placeholder="Your name as on your student ID" style="height: 52px; border: 1px solid #CBD5E1; border-radius: 12px; padding: 0 16px; font-size: 16px; font-family: inherit">
      </div>
      <div style="display: flex; flex-direction: column; gap: 8px">
        <label for="em" style="font-size: 15px; font-weight: 600">University email</label>
        <input id="em" type="email" dir="ltr" placeholder="name12345@sut.edu.eg" style="height: 52px; border: 1px solid #CBD5E1; border-radius: 12px; padding: 0 16px; font-size: 16px; font-family: inherit; text-align: left">
      </div>
      <div style="display: flex; flex-direction: column; gap: 8px">
        <label for="pw" style="font-size: 15px; font-weight: 600">Password</label>
        <input id="pw" type="password" placeholder="At least 8 characters" style="height: 52px; border: 1px solid #CBD5E1; border-radius: 12px; padding: 0 16px; font-size: 16px; font-family: inherit">
      </div>
      <div style="flex: 1"></div>
      <button type="button" onClick="{{next}}" style="border: none; cursor: pointer; background: #1E4FA3; color: #FFFFFF; font-weight: 600; font-size: 17px; font-family: inherit; border-radius: 14px; height: 54px">Send verification code</button>
    </form>
  </sc-if>

  <sc-if value="{{isStep2}}" hint-placeholder-val="{{ true }}">
    <form style="flex: 1; padding: 16px 20px 28px; display: flex; flex-direction: column; gap: 18px">
      <span style="width: 52px; height: 52px; border-radius: 16px; background: #E8EEF9; display: flex; align-items: center; justify-content: center"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#1E4FA3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg></span>
      <h1 style="margin: 0; font-size: 26px">Enter verification code</h1>
      <p style="margin: 0; color: #475569; line-height: 1.7; font-size: 15px">We sent a 6-digit code to <span dir="ltr" style="font-weight: 600; color: #0F172A">name12345@sut.edu.eg</span></p>
      <div dir="ltr" style="display: flex; gap: 8px; justify-content: space-between">
        <input aria-label="Digit 1" maxlength="1" value="4" style="width: 48px; height: 58px; text-align: center; font-size: 24px; font-weight: 700; border: 2px solid #1E4FA3; border-radius: 12px; font-family: inherit; box-sizing: border-box">
        <input aria-label="Digit 2" maxlength="1" value="8" style="width: 48px; height: 58px; text-align: center; font-size: 24px; font-weight: 700; border: 2px solid #1E4FA3; border-radius: 12px; font-family: inherit; box-sizing: border-box">
        <input aria-label="Digit 3" maxlength="1" value="2" style="width: 48px; height: 58px; text-align: center; font-size: 24px; font-weight: 700; border: 2px solid #1E4FA3; border-radius: 12px; font-family: inherit; box-sizing: border-box">
        <input aria-label="Digit 4" maxlength="1" style="width: 48px; height: 58px; text-align: center; font-size: 24px; font-weight: 700; border: 1px solid #CBD5E1; border-radius: 12px; font-family: inherit; box-sizing: border-box">
        <input aria-label="Digit 5" maxlength="1" style="width: 48px; height: 58px; text-align: center; font-size: 24px; font-weight: 700; border: 1px solid #CBD5E1; border-radius: 12px; font-family: inherit; box-sizing: border-box">
        <input aria-label="Digit 6" maxlength="1" style="width: 48px; height: 58px; text-align: center; font-size: 24px; font-weight: 700; border: 1px solid #CBD5E1; border-radius: 12px; font-family: inherit; box-sizing: border-box">
      </div>
      <div style="display: flex; justify-content: space-between; align-items: center; font-size: 15px; color: #475569">
        <span>Resend in 0:45</span>
        <button type="button" onClick="{{back}}" style="border: none; background: none; color: #1E4FA3; font-weight: 600; font-size: 15px; font-family: inherit; cursor: pointer; min-height: 44px">Change email</button>
      </div>
      <div style="flex: 1"></div>
      <a href="ProfileM.dc.html" style="text-decoration: none; background: #1E4FA3; color: #FFFFFF; font-weight: 600; font-size: 17px; border-radius: 14px; height: 54px; display: flex; align-items: center; justify-content: center">Confirm</a>
    </form>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { step: 2 }; }
  renderVals() {
    const s = this.state.step;
    return {
      isStep1: s === 1,
      isStep2: s === 2,
      bar2: s === 2 ? '#1E4FA3' : '#E2E8F0',
      next: () => this.setState({ step: 2 }),
      back: () => this.setState({ step: 1 })
    };
  }
}
</script>
</body>
</html>
