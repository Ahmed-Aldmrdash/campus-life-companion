<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>شات الاتفاق · موبايل</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1E4FA3}a:hover{color:#163C7D}
</style>
</helmet>
<div dir="rtl" style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #F8FAFC; font-family: 'IBM Plex Sans Arabic', system-ui, sans-serif; color: #0F172A; overflow: hidden">
  <header style="background: #FFFFFF; padding: 8px 8px; display: flex; align-items: center; gap: 8px; flex: none; border-bottom: 1px solid #E2E8F0">
    <a href="FindM.dc.html" aria-label="رجوع" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #0F172A"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></a>
    <span style="width: 40px; height: 40px; border-radius: 999px; background: #DBEAFE; font-weight: 700; display: flex; align-items: center; justify-content: center; flex: none">ي</span>
    <span style="flex: 1; display: flex; flex-direction: column"><span style="font-weight: 700">يوسف خالد</span><span style="font-size: 12px; color: #475569">★ ٤٫٨ · فيرنا فضي</span></span>
    <a href="ReportM.dc.html" aria-label="بلّغ" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #475569"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 21V4M5 4h11l-2 4 2 4H5"/></svg></a>
  </header>

  <div style="background: #FFFFFF; margin: 10px 12px 0; border: 1px solid #E2E8F0; border-radius: 14px; padding: 10px 12px; display: flex; align-items: center; gap: 10px; flex: none">
    <span style="flex: 1; display: flex; flex-direction: column; font-size: 13px"><span style="font-weight: 600; font-size: 14px">بكرة ٧:١٥ ص · ٣٥ ج</span><span style="color: #475569">الالتقاء: بنزينة التعاون</span></span>
    <sc-if value="{{pending}}" hint-placeholder-val="{{ true }}">
      <button type="button" onClick="{{confirm}}" style="height: 44px; border: none; border-radius: 10px; background: #1E4FA3; color: #FFFFFF; font-family: inherit; font-size: 14px; font-weight: 600; padding: 0 14px; cursor: pointer">أكّد الرحلة</button>
    </sc-if>
    <sc-if value="{{confirmed}}" hint-placeholder-val="{{ false }}">
      <span style="background: #E7F5EC; color: #14532D; border-radius: 10px; padding: 10px 12px; font-size: 14px; font-weight: 600">متأكدة</span>
    </sc-if>
  </div>

  <div style="flex: 1; padding: 14px 12px; display: flex; flex-direction: column; gap: 10px; overflow: hidden">
    <span style="align-self: center; font-size: 12px; color: #64748B; background: #E2E8F0; border-radius: 999px; padding: 4px 12px">طلبتي تنضمي للرحلة</span>
    <div style="align-self: flex-start; max-width: 78%; background: #FFFFFF; border: 1px solid #E2E8F0; border-radius: 16px 16px 16px 4px; padding: 10px 12px; line-height: 1.7; font-size: 15px">أهلًا، متحرك ٧:١٥. تقدري تيجي عند بنزينة التعاون؟</div>
    <div style="align-self: flex-end; max-width: 78%; background: #1E4FA3; color: #FFFFFF; border-radius: 16px 16px 4px 16px; padding: 10px 12px; line-height: 1.7; font-size: 15px">تمام جدًا، أنا ساكنة جنبها</div>
    <div style="align-self: flex-start; width: 240px; background: #FFFFFF; border: 1px solid #E2E8F0; border-radius: 16px; padding: 6px; display: flex; flex-direction: column; gap: 6px">
      <svg width="226" height="100" viewBox="0 0 226 100" aria-hidden="true" style="border-radius: 10px; display: block"><rect width="226" height="100" fill="#E9EEF3"/><g stroke="#FFFFFF" stroke-width="9"><path d="M-5 50 L231 42"/><path d="M105 -5 L113 105"/></g><path d="M110 48s-9-8-9-15a9 9 0 0 1 18 0c0 7-9 15-9 15z" fill="#15803D"/><circle cx="110" cy="33" r="3" fill="#FFFFFF"/></svg>
      <span style="font-size: 13px; padding: 0 6px 4px"><span style="font-weight: 600">نقطة الالتقاء:</span> بنزينة التعاون</span>
    </div>
    <div style="align-self: flex-start; max-width: 78%; background: #FFFFFF; border: 1px solid #E2E8F0; border-radius: 16px 16px 16px 4px; padding: 10px 12px; line-height: 1.7; font-size: 15px">تمام، هستناكي عند البنزينة</div>
  </div>

  <form style="background: #FFFFFF; padding: 10px 12px 16px; border-top: 1px solid #E2E8F0; display: flex; gap: 8px; align-items: center; flex: none">
    <button type="button" aria-label="شارك مكان" style="width: 44px; height: 44px; border-radius: 12px; border: 1px solid #E2E8F0; background: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #334155"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-12a7 7 0 0 1 14 0c0 5.8-7 12-7 12z"/><circle cx="12" cy="9" r="2.5"/></svg></button>
    <label for="msg" style="position: absolute; width: 1px; height: 1px; overflow: hidden">رسالة</label>
    <input id="msg" placeholder="اكتب رسالة" style="flex: 1; min-width: 0; height: 44px; border: 1px solid #CBD5E1; border-radius: 12px; padding: 0 12px; font-size: 15px; font-family: inherit">
    <button type="button" aria-label="إرسال" style="width: 44px; height: 44px; border-radius: 12px; border: none; background: #1E4FA3; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="transform: scaleX(-1)"><path d="M21 3L10 14M21 3l-7 18-4-7-7-4z"/></svg></button>
  </form>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { ok: false }; }
  renderVals() {
    return { pending: !this.state.ok, confirmed: this.state.ok, confirm: () => this.setState({ ok: true }) };
  }
}
</script>
</body>
</html>
