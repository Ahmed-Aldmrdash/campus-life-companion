<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>تحديد الموقع · ديسكتوب</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1E4FA3}a:hover{color:#163C7D}
</style>
</helmet>
<div dir="rtl" style="min-height: 900px; display: flex; flex-direction: column; background: #F6F8FB; font-family: 'IBM Plex Sans Arabic', system-ui, sans-serif; color: #0F172A">
  <header style="background: #FFFFFF; border-bottom: 1px solid #E2E8F0">
    <div style="max-width: 1280px; margin: 0 auto; padding: 0 32px; height: 72px; display: flex; align-items: center; gap: 32px; flex-wrap: wrap">
      <a href="HomeD.dc.html" style="display: flex; align-items: center; gap: 10px; text-decoration: none; color: #0F172A">
        <span style="width: 36px; height: 36px; border-radius: 10px; background: #1E4FA3; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="18" r="2.5"/><circle cx="18" cy="6" r="2.5"/><path d="M8.5 18H15a3 3 0 0 0 0-6H9a3 3 0 0 1 0-6h6.5"/></svg></span>
        <span style="font-weight: 700; font-size: 17px">Campus Life</span>
      </a>
      <nav style="display: flex; gap: 8px; flex: 1; flex-wrap: wrap; font-size: 15px">
        <a href="HomeD.dc.html" style="text-decoration: none; color: #1E4FA3; font-weight: 600; background: #E8EEF9; border-radius: 10px; padding: 10px 14px">الرئيسية</a>
        <a href="FindD.dc.html" style="text-decoration: none; color: #334155; border-radius: 10px; padding: 10px 14px">الرحلات</a>
        <a href="BotD.dc.html" style="text-decoration: none; color: #334155; border-radius: 10px; padding: 10px 14px">المساعد</a>
        <a href="ProfileD.dc.html" style="text-decoration: none; color: #334155; border-radius: 10px; padding: 10px 14px">البروفايل</a>
      </nav>
      <a href="ProfileD.dc.html" aria-label="البروفايل" style="width: 40px; height: 40px; border-radius: 999px; background: #CBD5E1; color: #0F172A; font-weight: 700; text-decoration: none; display: flex; align-items: center; justify-content: center">م</a>
    </div>
  </header>

  <div style="flex: 1; display: flex; flex-wrap: wrap">
    <form style="flex: 1 1 420px; max-width: 480px; background: #FFFFFF; border-inline-end: 1px solid #E2E8F0; padding: 32px; display: flex; flex-direction: column; gap: 22px; box-sizing: border-box">
      <h1 style="margin: 0; font-size: 26px">رايح الجامعة منين؟</h1>

      <div style="display: flex; flex-direction: column; gap: 10px">
        <label for="from" style="font-weight: 600; font-size: 15px">نقطة البداية</label>
        <div style="display: flex; align-items: center; gap: 10px; height: 52px; border: 2px solid #1E4FA3; border-radius: 12px; padding: 0 14px">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#475569" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
          <input id="from" value="مدينة نصر، شارع عباس العقاد" style="flex: 1; border: none; outline: none; font-size: 16px; font-family: inherit; min-width: 0">
        </div>
        <button type="button" style="align-self: flex-start; display: flex; align-items: center; gap: 8px; background: #E8EEF9; color: #1E4FA3; border: none; border-radius: 10px; height: 44px; padding: 0 14px; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>استخدم موقعي الحالي</button>
        <div style="display: flex; gap: 8px; flex-wrap: wrap">
          <span style="border: 1px solid #CBD5E1; border-radius: 999px; padding: 6px 12px; font-size: 14px; color: #334155">البيت · مدينة نصر</span>
          <span style="border: 1px solid #CBD5E1; border-radius: 999px; padding: 6px 12px; font-size: 14px; color: #334155">محطة عدلي منصور</span>
          <span style="border: 1px solid #CBD5E1; border-radius: 999px; padding: 6px 12px; font-size: 14px; color: #334155">الهرم</span>
        </div>
      </div>

      <div style="display: flex; align-items: center; gap: 12px; background: #F6F8FB; border-radius: 12px; padding: 14px">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1E4FA3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10l9-6 9 6-9 6z"/><path d="M7 12.5V17c3 2 7 2 10 0v-4.5"/></svg>
        <span style="display: flex; flex-direction: column"><span style="font-size: 13px; color: #475569">الوجهة</span><span style="font-weight: 600">جامعة السويدي للتكنولوجيا · العاشر من رمضان</span></span>
      </div>

      <div style="display: flex; flex-direction: column; gap: 10px">
        <span style="font-weight: 600; font-size: 15px">معاك عربية؟</span>
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
          <button type="button" onClick="{{setCar}}" style="height: 72px; border-radius: 14px; border: 2px solid {{carBorder}}; background: {{carBg}}; font-family: inherit; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 16px; font-weight: 600; color: #0F172A"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 13l2-6h14l2 6v5h-2M3 13v5h2M3 13h18"/><circle cx="7.5" cy="18" r="1.8"/><circle cx="16.5" cy="18" r="1.8"/></svg>معايا عربية</button>
          <button type="button" onClick="{{setNoCar}}" style="height: 72px; border-radius: 14px; border: 2px solid {{noBorder}}; background: {{noBg}}; font-family: inherit; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 16px; font-weight: 600; color: #0F172A"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="3" width="14" height="14" rx="3"/><path d="M5 11h14M8 21l2-4M16 21l-2-4"/></svg>معنديش</button>
        </div>
        <span style="font-size: 13px; color: #64748B">محفوظة من البروفايل، تقدر تغيرها للمشوار ده بس</span>
      </div>

      <div style="display: flex; flex-direction: column; gap: 10px">
        <label for="when" style="font-weight: 600; font-size: 15px">هتتحرك إمتى؟</label>
        <div style="display: flex; gap: 10px">
          <span style="flex: 1; height: 48px; border-radius: 12px; background: #1E4FA3; color: #FFFFFF; font-weight: 600; display: flex; align-items: center; justify-content: center">دلوقتي</span>
          <input id="when" type="time" value="07:30" style="flex: 1; height: 48px; border: 1px solid #CBD5E1; border-radius: 12px; padding: 0 12px; font-size: 16px; font-family: inherit; box-sizing: border-box">
        </div>
      </div>

      <div style="flex: 1"></div>
      <a href="RouteD.dc.html" style="text-decoration: none; background: #1E4FA3; color: #FFFFFF; font-weight: 600; font-size: 17px; border-radius: 12px; height: 54px; display: flex; align-items: center; justify-content: center">اعرض الطريق</a>
    </form>

    <div style="flex: 999 1 480px; min-width: 0; min-height: 600px; position: relative; background: #E9EEF3">
      <svg width="100%" height="100%" viewBox="0 0 900 760" preserveAspectRatio="xMidYMid slice" aria-hidden="true" style="position: absolute; inset: 0">
        <rect width="900" height="760" fill="#E9EEF3"/>
        <path d="M0 560 C180 520 300 600 480 540 S780 480 900 500 L900 580 C780 560 640 620 480 615 S180 600 0 650Z" fill="#CFE0F2"/>
        <g stroke="#FFFFFF" stroke-width="18" fill="none" stroke-linecap="round"><path d="M-10 200 L910 150"/><path d="M-10 400 L910 370"/><path d="M150 -10 L230 770"/><path d="M450 -10 L420 770"/><path d="M700 -10 L780 770"/></g>
        <g stroke="#FFFFFF" stroke-width="8" fill="none"><path d="M-10 300 L910 270"/><path d="M300 -10 L330 770"/><path d="M580 -10 L600 770"/></g>
        <g fill="#DCE3EA"><rect x="250" y="220" width="160" height="70" rx="8"/><rect x="480" y="200" width="200" height="60" rx="8"/><rect x="40" y="40" width="80" height="130" rx="8"/><rect x="480" y="410" width="200" height="90" rx="8"/><rect x="250" y="420" width="140" height="80" rx="8"/></g>
        <circle cx="440" cy="330" r="60" fill="#1E4FA3" fill-opacity="0.12"/>
      </svg>
      <div style="position: absolute; left: 50%; top: 43%; transform: translate(-50%, -100%)">
        <svg width="48" height="48" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22s-8-7-8-13a8 8 0 0 1 16 0c0 6-8 13-8 13z" fill="#1E4FA3"/><circle cx="12" cy="9" r="3" fill="#FFFFFF"/></svg>
      </div>
      <div style="position: absolute; inset-inline-start: 24px; top: 24px; background: #FFFFFF; border-radius: 12px; padding: 10px 14px; font-size: 14px; box-shadow: 0 4px 16px rgba(15,23,42,0.1)">حرّك الخريطة عشان تظبط مكانك</div>
      <div style="position: absolute; inset-inline-end: 24px; bottom: 24px; display: flex; flex-direction: column; gap: 8px">
        <button type="button" aria-label="تكبير" style="width: 44px; height: 44px; border-radius: 12px; border: 1px solid #E2E8F0; background: #FFFFFF; font-size: 22px; cursor: pointer">+</button>
        <button type="button" aria-label="تصغير" style="width: 44px; height: 44px; border-radius: 12px; border: 1px solid #E2E8F0; background: #FFFFFF; font-size: 22px; cursor: pointer">−</button>
      </div>
      <span style="position: absolute; left: 8px; bottom: 6px; font-size: 11px; color: #475569">© OpenStreetMap</span>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { car: true }; }
  renderVals() {
    const c = this.state.car;
    return {
      carBorder: c ? '#1E4FA3' : '#CBD5E1', carBg: c ? '#E8EEF9' : '#FFFFFF',
      noBorder: c ? '#CBD5E1' : '#1E4FA3', noBg: c ? '#FFFFFF' : '#E8EEF9',
      setCar: () => this.setState({ car: true }),
      setNoCar: () => this.setState({ car: false })
    };
  }
}
</script>
</body>
</html>
