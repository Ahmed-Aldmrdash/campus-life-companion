<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>البروفايل · موبايل</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1E4FA3}a:hover{color:#163C7D}
</style>
</helmet>
<div dir="rtl" style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #F6F8FB; font-family: 'IBM Plex Sans Arabic', system-ui, sans-serif; color: #0F172A; overflow: hidden">
  <main style="flex: 1; overflow: hidden; display: flex; flex-direction: column; gap: 14px; padding: 0 16px 16px">
    <section style="margin: 0 -16px; background: #FFFFFF; border-bottom: 1px solid #E2E8F0; padding: 20px 20px 16px; display: flex; gap: 14px; align-items: center">
      <span style="width: 64px; height: 64px; border-radius: 999px; background: #CBD5E1; font-size: 26px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex: none">م</span>
      <span style="flex: 1; display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 20px; font-weight: 700">مريم أحمد</span>
        <span style="font-size: 14px; color: #475569">هندسة · ★ ٤٫٩ · ٢٣ رحلة</span>
      </span>
    </section>

    <a href="StatusM.dc.html" style="text-decoration: none; background: #E7F5EC; color: #14532D; border-radius: 14px; padding: 12px 14px; display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 15px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 3v6c0 4.5-3.4 8-8 9-4.6-1-8-4.5-8-9V6z"/><path d="M9 12l2 2 4-4"/></svg><span style="flex: 1">حالة الحساب: سليم</span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></a>

    <form style="background: #FFFFFF; border: 1px solid #E2E8F0; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 14px">
      <div style="display: flex; flex-direction: column; gap: 6px">
        <label for="area" style="font-weight: 600; font-size: 14px">منطقة السكن</label>
        <select id="area" style="height: 48px; border: 1px solid #CBD5E1; border-radius: 12px; padding: 0 12px; font-size: 16px; font-family: inherit; background: #FFFFFF"><option>مدينة نصر</option><option>العاشر من رمضان</option><option>الهرم</option></select>
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px">
        <span style="font-weight: 600; font-size: 14px">معاك عربية؟</span>
        <div style="display: flex; gap: 8px">
          <button type="button" onClick="{{setCar}}" style="flex: 1; height: 48px; border-radius: 12px; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer; border: 2px solid {{carBorder}}; background: {{carBg}}; color: #0F172A">معايا عربية</button>
          <button type="button" onClick="{{setNoCar}}" style="flex: 1; height: 48px; border-radius: 12px; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer; border: 2px solid {{noBorder}}; background: {{noBg}}; color: #0F172A">معنديش</button>
        </div>
      </div>
      <sc-if value="{{hasCar}}" hint-placeholder-val="{{ true }}">
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; background: #F6F8FB; border-radius: 12px; padding: 12px">
          <div style="display: flex; flex-direction: column; gap: 4px"><label for="cm" style="font-size: 13px; font-weight: 600">العربية</label><input id="cm" value="إلنترا ٢٠١٨" style="height: 44px; border: 1px solid #CBD5E1; border-radius: 10px; padding: 0 10px; font-size: 15px; font-family: inherit; min-width: 0"></div>
          <div style="display: flex; flex-direction: column; gap: 4px"><label for="cp" style="font-size: 13px; font-weight: 600">اللوحة</label><input id="cp" value="ق ط ر ٤٥٦٧" style="height: 44px; border: 1px solid #CBD5E1; border-radius: 10px; padding: 0 10px; font-size: 15px; font-family: inherit; min-width: 0"></div>
          <div style="display: flex; flex-direction: column; gap: 4px"><label for="cc" style="font-size: 13px; font-weight: 600">اللون</label><input id="cc" value="فضي" style="height: 44px; border: 1px solid #CBD5E1; border-radius: 10px; padding: 0 10px; font-size: 15px; font-family: inherit; min-width: 0"></div>
          <div style="display: flex; flex-direction: column; gap: 4px"><label for="cf" style="font-size: 13px; font-weight: 600">لتر/١٠٠ كم</label><input id="cf" value="٧٫٥" style="height: 44px; border: 1px solid #CBD5E1; border-radius: 10px; padding: 0 10px; font-size: 15px; font-family: inherit; min-width: 0"></div>
        </div>
      </sc-if>
    </form>

    <section style="background: #FFFFFF; border: 1px solid #E2E8F0; border-radius: 16px; padding: 0 16px">
      <div style="display: flex; justify-content: space-between; align-items: center; min-height: 56px; border-bottom: 1px solid #E2E8F0"><span style="font-weight: 600">اللغة</span><span style="display: flex; gap: 2px; background: #F1F5F9; border-radius: 10px; padding: 3px; font-size: 14px"><span style="background: #FFFFFF; border-radius: 8px; padding: 6px 12px; font-weight: 600">عربي</span><span style="padding: 6px 12px; color: #475569">EN</span></span></div>
      <div style="display: flex; justify-content: space-between; align-items: center; min-height: 56px"><span style="font-weight: 600">الوضع الليلي</span><span style="display: flex; gap: 2px; background: #F1F5F9; border-radius: 10px; padding: 3px; font-size: 14px"><span style="background: #FFFFFF; border-radius: 8px; padding: 6px 12px; font-weight: 600">تلقائي</span><span style="padding: 6px 12px; color: #475569">غامق</span></span></div>
    </section>
  </main>

  <nav aria-label="التنقل" style="height: 72px; flex: none; background: #FFFFFF; border-top: 1px solid #E2E8F0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr))">
    <a href="HomeM.dc.html" style="text-decoration: none; color: #64748B; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10l9-7 9 7v10a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>الرئيسية</a>
    <a href="FindM.dc.html" style="text-decoration: none; color: #64748B; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 13l2-6h14l2 6v5h-2M3 13v5h2M3 13h18"/><circle cx="7.5" cy="18" r="1.8"/><circle cx="16.5" cy="18" r="1.8"/></svg>الرحلات</a>
    <a href="BotM.dc.html" style="text-decoration: none; color: #64748B; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>المساعد</a>
    <a href="ProfileM.dc.html" style="text-decoration: none; color: #1E4FA3; font-weight: 600; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>البروفايل</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { car: true }; }
  renderVals() {
    const c = this.state.car;
    return {
      hasCar: c,
      carBorder: c ? '#1E4FA3' : '#CBD5E1', carBg: c ? '#E8EEF9' : '#FFFFFF',
      noBorder: c ? '#CBD5E1' : '#1E4FA3', noBg: c ? '#FFFFFF' : '#E8EEF9',
      setCar: () => this.setState({ car: true }),
      setNoCar: () => this.setState({ car: false })
    };
  }
}
</script>
</body>
</html>
