<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>حساب جديد ورمز التحقق · ديسكتوب</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1E4FA3}a:hover{color:#163C7D}
</style>
</helmet>
<div dir="rtl" style="min-height: 900px; display: flex; flex-wrap: wrap; background: #FFFFFF; font-family: 'IBM Plex Sans Arabic', system-ui, sans-serif; color: #0F172A">
  <aside style="flex: 1 1 420px; background: #0F2A57; color: #FFFFFF; padding: 48px; display: flex; flex-direction: column; gap: 40px; box-sizing: border-box">
    <a href="Main.dc.html" style="display: flex; align-items: center; gap: 10px; text-decoration: none; color: #FFFFFF">
      <span style="width: 36px; height: 36px; border-radius: 10px; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1E4FA3" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="18" r="2.5"/><circle cx="18" cy="6" r="2.5"/><path d="M8.5 18H15a3 3 0 0 0 0-6H9a3 3 0 0 1 0-6h6.5"/></svg></span>
      <span style="font-weight: 700; font-size: 17px">Campus Life</span>
    </a>
    <h1 style="margin: 0; font-size: 36px; line-height: 1.35; max-width: 440px">حساب واحد لكل مشاويرك للجامعة</h1>
    <ol style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 20px">
      <li style="display: flex; gap: 14px; align-items: center"><span style="width: 36px; height: 36px; border-radius: 999px; background: #FFFFFF; color: #0F2A57; font-weight: 700; display: flex; align-items: center; justify-content: center">١</span><span style="font-size: 17px">بياناتك وإيميل الجامعة</span></li>
      <li style="display: flex; gap: 14px; align-items: center"><span style="width: 36px; height: 36px; border-radius: 999px; border: 2px solid {{step2Ring}}; color: #FFFFFF; font-weight: 700; display: flex; align-items: center; justify-content: center; box-sizing: border-box">٢</span><span style="font-size: 17px">رمز التحقق على الإيميل</span></li>
      <li style="display: flex; gap: 14px; align-items: center"><span style="width: 36px; height: 36px; border-radius: 999px; border: 2px solid #64748B; color: #FFFFFF; font-weight: 700; display: flex; align-items: center; justify-content: center; box-sizing: border-box">٣</span><span style="font-size: 17px">منطقتك وهل معاك عربية</span></li>
    </ol>
  </aside>

  <main style="flex: 1 1 520px; display: flex; align-items: center; justify-content: center; padding: 48px 32px; box-sizing: border-box">
    <sc-if value="{{isStep1}}" hint-placeholder-val="{{ true }}">
      <form style="width: 100%; max-width: 440px; display: flex; flex-direction: column; gap: 18px">
        <h2 style="margin: 0; font-size: 28px">إنشاء حساب</h2>
        <div style="display: flex; flex-direction: column; gap: 8px">
          <label for="nm" style="font-size: 15px; font-weight: 600">الاسم</label>
          <input id="nm" type="text" placeholder="اسمك زي ما هو في الكارنيه" style="height: 52px; border: 1px solid #CBD5E1; border-radius: 12px; padding: 0 16px; font-size: 16px; font-family: inherit">
        </div>
        <div style="display: flex; flex-direction: column; gap: 8px">
          <label for="em" style="font-size: 15px; font-weight: 600">إيميل الجامعة</label>
          <input id="em" type="email" dir="ltr" placeholder="name12345@sut.edu.eg" style="height: 52px; border: 1px solid #CBD5E1; border-radius: 12px; padding: 0 16px; font-size: 16px; font-family: inherit; text-align: left">
          <span style="font-size: 13px; color: #64748B">لازم ينتهي بـ ‎@sut.edu.eg</span>
        </div>
        <div style="display: flex; flex-direction: column; gap: 8px">
          <label for="pw" style="font-size: 15px; font-weight: 600">كلمة السر</label>
          <input id="pw" type="password" placeholder="٨ حروف على الأقل" style="height: 52px; border: 1px solid #CBD5E1; border-radius: 12px; padding: 0 16px; font-size: 16px; font-family: inherit">
        </div>
        <button type="button" onClick="{{next}}" style="border: none; cursor: pointer; background: #1E4FA3; color: #FFFFFF; font-weight: 600; font-size: 17px; font-family: inherit; border-radius: 12px; height: 52px">ابعت رمز التحقق</button>
        <p style="margin: 0; text-align: center; color: #475569; font-size: 15px">عندك حساب؟ <a href="LoginD.dc.html" style="font-weight: 600; text-decoration: none">تسجيل الدخول</a></p>
      </form>
    </sc-if>
    <sc-if value="{{isStep2}}" hint-placeholder-val="{{ false }}">
      <form style="width: 100%; max-width: 440px; display: flex; flex-direction: column; gap: 20px">
        <span style="width: 56px; height: 56px; border-radius: 16px; background: #E8EEF9; display: flex; align-items: center; justify-content: center"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#1E4FA3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg></span>
        <h2 style="margin: 0; font-size: 28px">اكتب رمز التحقق</h2>
        <p style="margin: 0; color: #475569; line-height: 1.7">بعتنا رمز من ٦ أرقام على <span dir="ltr" style="font-weight: 600; color: #0F172A">name12345@sut.edu.eg</span></p>
        <div dir="ltr" style="display: flex; gap: 10px">
          <input aria-label="رقم ١" maxlength="1" value="4" style="width: 56px; height: 64px; text-align: center; font-size: 26px; font-weight: 700; border: 2px solid #1E4FA3; border-radius: 12px; font-family: inherit">
          <input aria-label="رقم ٢" maxlength="1" value="8" style="width: 56px; height: 64px; text-align: center; font-size: 26px; font-weight: 700; border: 2px solid #1E4FA3; border-radius: 12px; font-family: inherit">
          <input aria-label="رقم ٣" maxlength="1" value="2" style="width: 56px; height: 64px; text-align: center; font-size: 26px; font-weight: 700; border: 2px solid #1E4FA3; border-radius: 12px; font-family: inherit">
          <input aria-label="رقم ٤" maxlength="1" style="width: 56px; height: 64px; text-align: center; font-size: 26px; font-weight: 700; border: 1px solid #CBD5E1; border-radius: 12px; font-family: inherit">
          <input aria-label="رقم ٥" maxlength="1" style="width: 56px; height: 64px; text-align: center; font-size: 26px; font-weight: 700; border: 1px solid #CBD5E1; border-radius: 12px; font-family: inherit">
          <input aria-label="رقم ٦" maxlength="1" style="width: 56px; height: 64px; text-align: center; font-size: 26px; font-weight: 700; border: 1px solid #CBD5E1; border-radius: 12px; font-family: inherit">
        </div>
        <a href="ProfileD.dc.html" style="text-decoration: none; background: #1E4FA3; color: #FFFFFF; font-weight: 600; font-size: 17px; border-radius: 12px; height: 52px; display: flex; align-items: center; justify-content: center">تأكيد وكمّل بياناتك</a>
        <div style="display: flex; justify-content: space-between; font-size: 15px; color: #475569">
          <span>ابعت تاني بعد ٠:٤٥</span>
          <button type="button" onClick="{{back}}" style="border: none; background: none; color: #1E4FA3; font-weight: 600; font-size: 15px; font-family: inherit; cursor: pointer; padding: 0">غيّر الإيميل</button>
        </div>
      </form>
    </sc-if>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { step: 1 }; }
  renderVals() {
    const s = this.state.step;
    return {
      isStep1: s === 1,
      isStep2: s === 2,
      step2Ring: s === 2 ? '#FFFFFF' : '#64748B',
      next: () => this.setState({ step: 2 }),
      back: () => this.setState({ step: 1 })
    };
  }
}
</script>
</body>
</html>
