<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<title>Offer a ride · Mobile</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1E4FA3}a:hover{color:#163C7D}
</style>
</helmet>
<div dir="ltr" style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #FFFFFF; font-family: 'Inter', system-ui, sans-serif; color: #0F172A; overflow: hidden">
  <header style="height: 64px; padding: 0 12px; display: flex; align-items: center; gap: 8px; flex: none; border-bottom: 1px solid #E2E8F0">
    <a href="HomeM.dc.html" aria-label="Back" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #0F172A"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></a>
    <h1 style="margin: 0; font-size: 19px">Offer a ride</h1>
  </header>

  <form style="flex: 1; padding: 16px 20px; display: flex; flex-direction: column; gap: 16px; overflow: hidden">
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="from" style="font-weight: 600; font-size: 14px">Where are you leaving from?</label>
      <input id="from" value="Nasr City, Abbas El-Akkad" style="height: 50px; border: 1px solid #CBD5E1; border-radius: 12px; padding: 0 14px; font-size: 16px; font-family: inherit">
    </div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <div style="display: flex; flex-direction: column; gap: 6px">
        <label for="day" style="font-weight: 600; font-size: 14px">Day</label>
        <select id="day" style="height: 50px; border: 1px solid #CBD5E1; border-radius: 12px; padding: 0 10px; font-size: 15px; font-family: inherit; background: #FFFFFF; min-width: 0"><option>Tomorrow</option><option>Today</option></select>
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px">
        <label for="t" style="font-weight: 600; font-size: 14px">Time</label>
        <input id="t" type="time" value="07:15" style="height: 50px; border: 1px solid #CBD5E1; border-radius: 12px; padding: 0 10px; font-size: 15px; font-family: inherit; min-width: 0; box-sizing: border-box">
      </div>
    </div>
    <div style="display: flex; align-items: center; justify-content: space-between; border: 1px solid #E2E8F0; border-radius: 14px; padding: 10px 14px">
      <span style="font-weight: 600; font-size: 15px">Empty seats</span>
      <span style="display: flex; align-items: center; gap: 12px">
        <button type="button" aria-label="Fewer" onClick="{{dec}}" style="width: 44px; height: 44px; border-radius: 12px; border: 1px solid #CBD5E1; background: #FFFFFF; font-size: 22px; cursor: pointer; font-family: inherit">−</button>
        <span style="font-size: 22px; font-weight: 700; min-width: 24px; text-align: center">{{seats}}</span>
        <button type="button" aria-label="More" onClick="{{inc}}" style="width: 44px; height: 44px; border-radius: 12px; border: 1px solid #CBD5E1; background: #FFFFFF; font-size: 22px; cursor: pointer; font-family: inherit">+</button>
      </span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="note" style="font-weight: 600; font-size: 14px">Note (optional)</label>
      <textarea id="note" rows="2" placeholder="e.g. I won't wait more than 5 minutes" style="border: 1px solid #CBD5E1; border-radius: 12px; padding: 10px 14px; font-size: 15px; font-family: inherit; resize: none"></textarea>
    </div>

    <div style="background: #E7F5EC; border-radius: 16px; padding: 16px; display: flex; justify-content: space-between; align-items: center">
      <span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 13px; color: #14532D">Each rider pays</span><span style="font-size: 30px; font-weight: 700; color: #14532D">{{share}} EGP</span></span>
      <span style="font-size: 13px; color: #14532D; text-align: right">EGP 70 fuel<br>÷ {{people}} people</span>
    </div>
    <div style="flex: 1"></div>
    <a href="FindM.dc.html" style="text-decoration: none; background: #1E4FA3; color: #FFFFFF; font-weight: 600; font-size: 17px; border-radius: 14px; height: 54px; display: flex; align-items: center; justify-content: center; flex: none">Publish ride</a>
  </form>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { seats: 3 }; }
  renderVals() {
    const s = this.state.seats;
    const ar = (n) => String(n).replace(/[0-9]/g, (d) => '0123456789'[d]);
    return {
      seats: ar(s), people: ar(s + 1), share: ar(Math.round(70 / (s + 1))),
      inc: () => this.setState({ seats: Math.min(4, s + 1) }),
      dec: () => this.setState({ seats: Math.max(1, s - 1) })
    };
  }
}
</script>
</body>
</html>
