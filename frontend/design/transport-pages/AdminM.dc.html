<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>مراجعة البلاغات · موبايل</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1E4FA3}a:hover{color:#163C7D}
</style>
</helmet>
<div dir="rtl" style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #F6F8FB; font-family: 'IBM Plex Sans Arabic', system-ui, sans-serif; color: #0F172A; overflow: hidden">
  <header style="background: #0F2A57; color: #FFFFFF; padding: 16px; display: flex; flex-direction: column; gap: 12px; flex: none">
    <div style="display: flex; justify-content: space-between; align-items: center">
      <span style="display: flex; flex-direction: column"><span style="font-size: 12px; color: #CBD5E1">لوحة الإدارة</span><span style="font-size: 20px; font-weight: 700">البلاغات</span></span>
      <span style="background: #B91C1C; border-radius: 999px; padding: 4px 12px; font-size: 14px; font-weight: 600">١٢ مستني</span>
    </div>
    <div style="display: flex; gap: 8px">
      <span style="background: #FFFFFF; color: #0F2A57; border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 600">الأخطر أولًا</span>
      <span style="border: 1px solid rgba(255,255,255,0.4); border-radius: 999px; padding: 6px 12px; font-size: 13px">التظلمات · ٣</span>
    </div>
  </header>

  <main style="flex: 1; overflow: hidden; padding: 14px 12px; display: flex; flex-direction: column; gap: 12px">
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="3">
      <article style="background: #FFFFFF; border: 1px solid #E2E8F0; border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 10px">
        <div style="display: flex; justify-content: space-between; align-items: center">
          <span style="font-weight: 700" dir="ltr">{{r.id}}</span>
          <span style="border-radius: 999px; padding: 3px 10px; font-weight: 600; font-size: 12px; background: {{r.sevBg}}; color: {{r.sevFg}}">{{r.sev}}</span>
        </div>
        <span style="font-size: 14px"><span style="font-weight: 600">{{r.cat}}</span> · ضد {{r.who}} · {{r.ago}}</span>
        <span style="font-size: 14px; color: #475569; line-height: 1.6">"{{r.text}}"</span>
        <span style="font-size: 13px; color: #334155; background: #F6F8FB; border-radius: 8px; padding: 6px 10px">النموذج: {{r.ai}}</span>
        <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px">
          <button type="button" style="height: 44px; border-radius: 10px; border: 1px solid #CBD5E1; background: #FFFFFF; font-family: inherit; font-size: 14px; font-weight: 600; color: #334155; cursor: pointer">ارفض</button>
          <button type="button" style="height: 44px; border-radius: 10px; border: 1.5px solid #B91C1C; background: #FFFFFF; font-family: inherit; font-size: 14px; font-weight: 600; color: #B91C1C; cursor: pointer">إنذار</button>
          <button type="button" style="height: 44px; border-radius: 10px; border: none; background: #B91C1C; font-family: inherit; font-size: 14px; font-weight: 600; color: #FFFFFF; cursor: pointer">حظر</button>
        </div>
      </article>
    </sc-for>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const sev = [['#F1F5F9', '#334155'], ['#FEF3C7', '#78350F'], ['#FDECEC', '#7F1D1D']];
    const data = [
      { id: '#R-1042', cat: 'قيادة متهورة', who: 'يوسف خ.', lvl: 2, sev: 'عالي', ago: 'من ١٠ د', text: 'كان سايق بسرعة جدًا ورافض يهدّي.', ai: 'إنذار · ثقة ٩٢٪' },
      { id: '#R-1041', cat: 'مضايقة', who: 'كريم م.', lvl: 2, sev: 'عالي', ago: 'من ساعة', text: 'كلام مش لطيف في الشات.', ai: 'حظر ٧ أيام · ثقة ٨٨٪' },
      { id: '#R-1039', cat: 'تأخير', who: 'مريم أ.', lvl: 1, sev: 'متوسط', ago: 'من ٣ س', text: 'استنيتها ١٥ دقيقة.', ai: 'إنذار · ثقة ٧٥٪' }
    ];
    return { rows: data.map((d) => ({ ...d, sevBg: sev[d.lvl][0], sevFg: sev[d.lvl][1] })) };
  }
}
</script>
</body>
</html>
