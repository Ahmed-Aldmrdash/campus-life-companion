<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>البروفايل · ديسكتوب</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1E4FA3}a:hover{color:#163C7D}
</style>
</helmet>
<div dir="rtl" style="min-height: 900px; background: #F6F8FB; font-family: 'IBM Plex Sans Arabic', system-ui, sans-serif; color: #0F172A">
  <header style="background: #FFFFFF; border-bottom: 1px solid #E2E8F0">
    <div style="max-width: 1280px; margin: 0 auto; padding: 0 32px; height: 72px; display: flex; align-items: center; gap: 32px; flex-wrap: wrap">
      <a href="HomeD.dc.html" style="display: flex; align-items: center; gap: 10px; text-decoration: none; color: #0F172A">
        <span style="width: 36px; height: 36px; border-radius: 10px; background: #1E4FA3; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="18" r="2.5"/><circle cx="18" cy="6" r="2.5"/><path d="M8.5 18H15a3 3 0 0 0 0-6H9a3 3 0 0 1 0-6h6.5"/></svg></span>
        <span style="font-weight: 700; font-size: 17px">Campus Life</span>
      </a>
      <nav style="display: flex; gap: 8px; flex: 1; flex-wrap: wrap; font-size: 15px">
        <a href="HomeD.dc.html" style="text-decoration: none; color: #334155; border-radius: 10px; padding: 10px 14px">الرئيسية</a>
        <a href="FindD.dc.html" style="text-decoration: none; color: #334155; border-radius: 10px; padding: 10px 14px">الرحلات</a>
        <a href="BotD.dc.html" style="text-decoration: none; color: #334155; border-radius: 10px; padding: 10px 14px">المساعد</a>
        <a href="ProfileD.dc.html" style="text-decoration: none; color: #1E4FA3; font-weight: 600; background: #E8EEF9; border-radius: 10px; padding: 10px 14px">البروفايل</a>
      </nav>
      <a href="ProfileD.dc.html" style="text-decoration: none; color: #334155; font-size: 14px; border: 1px solid #CBD5E1; border-radius: 10px; padding: 8px 12px">EN</a>
      <a href="ProfileD.dc.html" aria-label="البروفايل" style="width: 40px; height: 40px; border-radius: 999px; background: #CBD5E1; color: #0F172A; font-weight: 700; text-decoration: none; display: flex; align-items: center; justify-content: center">م</a>
    </div>
  </header>

  <main style="max-width: 1280px; margin: 0 auto; padding: 32px; display: flex; gap: 24px; flex-wrap: wrap; align-items: flex-start">
    <aside style="flex: 1 1 300px; background: #FFFFFF; border: 1px solid #E2E8F0; border-radius: 16px; padding: 28px; display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center">
      <span style="width: 96px; height: 96px; border-radius: 999px; background: #CBD5E1; font-size: 36px; font-weight: 700; display: flex; align-items: center; justify-content: center">م</span>
      <h1 style="margin: 0; font-size: 24px">مريم أحمد</h1>
      <span style="color: #475569; font-size: 15px">هندسة · الفرقة الثالثة</span>
      <span dir="ltr" style="color: #475569; font-size: 14px">mariam24011@sut.edu.eg</span>
      <div style="display: flex; gap: 24px; margin-top: 8px">
        <span style="display: flex; flex-direction: column"><span style="font-size: 22px; font-weight: 700">٤٫٩</span><span style="font-size: 13px; color: #475569">التقييم</span></span>
        <span style="display: flex; flex-direction: column"><span style="font-size: 22px; font-weight: 700">٢٣</span><span style="font-size: 13px; color: #475569">رحلة</span></span>
      </div>
      <a href="StatusD.dc.html" style="text-decoration: none; margin-top: 8px; width: 100%; box-sizing: border-box; background: #E7F5EC; color: #14532D; border-radius: 12px; padding: 12px; display: flex; align-items: center; justify-content: center; gap: 8px; font-weight: 600"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 3v6c0 4.5-3.4 8-8 9-4.6-1-8-4.5-8-9V6z"/><path d="M9 12l2 2 4-4"/></svg>حالة الحساب: سليم</a>
      <a href="Main.dc.html" style="text-decoration: none; color: #475569; font-size: 15px; padding: 10px">تسجيل الخروج</a>
    </aside>

    <section style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 24px">
      <form style="background: #FFFFFF; border: 1px solid #E2E8F0; border-radius: 16px; padding: 28px; display: flex; flex-direction: column; gap: 20px">
        <h2 style="margin: 0; font-size: 20px">بيانات المشوار</h2>
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px">
          <div style="display: flex; flex-direction: column; gap: 8px">
            <label for="area" style="font-weight: 600; font-size: 15px">منطقة السكن</label>
            <select id="area" style="height: 50px; border: 1px solid #CBD5E1; border-radius: 12px; padding: 0 14px; font-size: 16px; font-family: inherit; background: #FFFFFF"><option>مدينة نصر</option><option>العاشر من رمضان</option><option>الهرم</option></select>
          </div>
          <div style="display: flex; flex-direction: column; gap: 8px">
            <label for="time" style="font-weight: 600; font-size: 15px">بتتحرك عادة الساعة</label>
            <input id="time" type="time" value="07:00" style="height: 50px; border: 1px solid #CBD5E1; border-radius: 12px; padding: 0 14px; font-size: 16px; font-family: inherit">
          </div>
        </div>
        <div style="display: flex; flex-direction: column; gap: 8px">
          <span style="font-weight: 600; font-size: 15px">معاك عربية؟</span>
          <div style="display: flex; gap: 12px">
            <button type="button" onClick="{{setCar}}" style="flex: 1; height: 50px; border-radius: 12px; font-family: inherit; font-size: 16px; font-weight: 600; cursor: pointer; border: 2px solid {{carBorder}}; background: {{carBg}}; color: #0F172A">معايا عربية</button>
            <button type="button" onClick="{{setNoCar}}" style="flex: 1; height: 50px; border-radius: 12px; font-family: inherit; font-size: 16px; font-weight: 600; cursor: pointer; border: 2px solid {{noBorder}}; background: {{noBg}}; color: #0F172A">معنديش</button>
          </div>
        </div>
        <sc-if value="{{hasCar}}" hint-placeholder-val="{{ true }}">
          <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; background: #F6F8FB; border-radius: 12px; padding: 16px">
            <div style="display: flex; flex-direction: column; gap: 6px"><label for="cm" style="font-size: 14px; font-weight: 600">نوع العربية</label><input id="cm" value="هيونداي إلنترا ٢٠١٨" style="height: 46px; border: 1px solid #CBD5E1; border-radius: 10px; padding: 0 12px; font-size: 15px; font-family: inherit"></div>
            <div style="display: flex; flex-direction: column; gap: 6px"><label for="cc" style="font-size: 14px; font-weight: 600">اللون</label><input id="cc" value="فضي" style="height: 46px; border: 1px solid #CBD5E1; border-radius: 10px; padding: 0 12px; font-size: 15px; font-family: inherit"></div>
            <div style="display: flex; flex-direction: column; gap: 6px"><label for="cp" style="font-size: 14px; font-weight: 600">رقم اللوحة</label><input id="cp" value="ق ط ر ٤٥٦٧" style="height: 46px; border: 1px solid #CBD5E1; border-radius: 10px; padding: 0 12px; font-size: 15px; font-family: inherit"></div>
            <div style="display: flex; flex-direction: column; gap: 6px"><label for="cf" style="font-size: 14px; font-weight: 600">الاستهلاك (لتر/١٠٠ كم)</label><input id="cf" value="٧٫٥" style="height: 46px; border: 1px solid #CBD5E1; border-radius: 10px; padding: 0 12px; font-size: 15px; font-family: inherit"></div>
          </div>
        </sc-if>
        <div style="display: flex; justify-content: flex-end"><a href="HomeD.dc.html" style="text-decoration: none; background: #1E4FA3; color: #FFFFFF; font-weight: 600; border-radius: 12px; padding: 14px 28px">حفظ</a></div>
      </form>

      <section style="background: #FFFFFF; border: 1px solid #E2E8F0; border-radius: 16px; padding: 8px 28px">
        <div style="display: flex; justify-content: space-between; align-items: center; min-height: 64px; border-bottom: 1px solid #E2E8F0"><span style="font-weight: 600">اللغة</span><span style="display: flex; gap: 4px; background: #F1F5F9; border-radius: 10px; padding: 4px"><span style="background: #FFFFFF; border-radius: 8px; padding: 8px 16px; font-weight: 600">عربي</span><span style="padding: 8px 16px; color: #475569">English</span></span></div>
        <div style="display: flex; justify-content: space-between; align-items: center; min-height: 64px; border-bottom: 1px solid #E2E8F0"><span style="font-weight: 600">الوضع الليلي</span><span style="display: flex; gap: 4px; background: #F1F5F9; border-radius: 10px; padding: 4px"><span style="background: #FFFFFF; border-radius: 8px; padding: 8px 16px; font-weight: 600">تلقائي</span><span style="padding: 8px 16px; color: #475569">فاتح</span><span style="padding: 8px 16px; color: #475569">غامق</span></span></div>
        <a href="FindD.dc.html" style="text-decoration: none; color: #0F172A; display: flex; justify-content: space-between; align-items: center; min-height: 64px"><span style="font-weight: 600">رحلاتي السابقة</span><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#64748B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></a>
      </section>
    </section>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { car: true }; }
  renderVals() {
    const c = this.state.car;
    return {
      hasCar: c,
      carBorder: c ? '#1E4FA3' : '#CBD5E1', carBg: c ? '#E8EEF9' : '#FFFFFF',
      noBorder: c ? '#CBD5E1' : '#1E4FA3', noBg: c ? '#FFFFFF' : '#E8EEF9',
      setCar: () => this.setState({ car: true }),
      setNoCar: () => this.setState({ car: false })
    };
  }
}
</script>
</body>
</html>
